name: Scheduled Maintenance

# Runs every 4 days at 09:00 UTC, inserts a harmless sample card
# into the kanban board so Supabase doesn't pause the project
# due to inactivity (applies to free-tier projects).

on:
  schedule:
    - cron: "0 9 */4 * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Insert keep-alive task
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROJECT_ID: ${{ secrets.KEEPALIVE_PROJECT_ID }}
        run: |
          curl -sSf -X POST "${SUPABASE_URL}/rest/v1/tasks" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
                  \"title\": \"🔄 keep-alive ping\",
                  \"status\": \"Backlog\",
                  \"priority\": \"Low\",
                  \"tag\": \"Feature\",
                  \"project_id\": \"${PROJECT_ID}\"
                }"
